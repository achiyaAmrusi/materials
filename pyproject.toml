[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materials"
version = "0.1.0"
description = "Material description in Python for nuclear data and calculations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["materials*"]

[tool.setuptools.package-data]
"materials.library" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
