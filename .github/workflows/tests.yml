name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # non-editable install on purpose: this is what catches packaging bugs
      # (e.g. missing package_data) that an editable/dev install would hide.
      - name: Install package
        run: pip install ".[dev]"
      - name: Run tests
        run: pytest -q
